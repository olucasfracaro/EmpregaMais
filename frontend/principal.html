<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Buscador</title>
    <link rel="stylesheet" href="style_principal.css">
    <link rel="icon" href="ico.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="page-header">
            <div class="title-area">
                <h1>Painel de Gerenciamento</h1>
                <p>Gerencie contatos, currículos e status de atendimento em tempo real.</p>
            </div>

            <div class="header-controls">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Buscar por Nome ou ID..."
                        autocomplete="off"
                    >
                </div>

                <button type="button" id="refreshCandidates" class="btn-refresh-candidates">
                    <i class="fa-solid fa-rotate"></i>
                    Atualizar
                </button>
            </div>
        </header>

        <main class="card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th id="sortById" class="sortable-header" tabindex="0" role="button">
                                ID <i id="sortByIdIcon" class="sort-indicator fa-solid fa-arrow-down" aria-hidden="true"></i>
                            </th>
                            <th id="sortByName" class="sortable-header" tabindex="0" role="button">
                                NOME <i id="sortByNameIcon" class="sort-indicator fa-solid fa-sort" aria-hidden="true"></i>
                            </th>
                            <th>TELEFONE</th>
                            <th>EMAIL</th>
                            <th class="text-center">MENSAGEM</th>
                            <th class="text-center">CURRÍCULO</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            
            <div id="emptyState" class="empty-state">
                <i class="fa-solid fa-folder-open"></i>
                <p>Nenhum registro foi encontrado com os termos pesquisados.</p>
            </div>

            <div class="table-actions">
                <button type="button" id="confirmChanges" class="btn-confirm-changes">
                    <i class="fa-solid fa-check"></i>
                    Confirmar alterações
                </button>
            </div>
        </main>
    </div>

    <div id="curriculumModal" class="curriculum-modal" hidden>
        <div class="curriculum-modal-panel" role="dialog" aria-modal="true" aria-labelledby="curriculumModalTitle">
            <div class="curriculum-modal-header">
                <h2 id="curriculumModalTitle">Currículo</h2>
                <button type="button" id="closeCurriculumModal" class="modal-close-button" title="Fechar visualização" aria-label="Fechar visualização">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="curriculumPreview" class="curriculum-preview" aria-live="polite">
                <p class="curriculum-viewer-status">Carregando currículo...</p>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="module" src="gerenciaCandidatos.js"></script>
</body>
</html>
