<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Buscador</title>
    <link rel="icon" href="ico.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --row-hover: #f1f5f9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);

           
            --status-con-bg: #dcfce7;
            --status-con-text: #15803d;
            --status-con-border: #bbf7d0;

            --status-pen-bg: #fef9c3;
            --status-pen-text: #a16207;
            --status-pen-border: #fef08a;

            --status-nao-bg: #fee2e2;
            --status-nao-text: #b91c1c;
            --status-nao-border: #fca5a5;
        }

       
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 768px) {
            .page-header {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .title-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .title-area p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

               .search-box {
            position: relative;
            width: 100%;
        }

        @media (min-width: 768px) {
            .search-box {
                width: 320px;
            }
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 0.625rem 0.75rem 0.625rem 2.25rem;
            font-size: 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background-color: var(--bg-card);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
            white-space: nowrap;
        }

        .data-table thead {
            background-color: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            padding: 0.875rem 1.25rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .data-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .data-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .data-table tbody tr:hover {
            background-color: var(--row-hover);
        }

        .text-center {
            text-align: center;
        }

        
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 0.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .btn-msg {
            color: #2563eb;
            background-color: #eff6ff;
        }

        .btn-msg:hover {
            background-color: #dbeafe;
            color: #1d4ed8;
        }

        .btn-cur {
            color: #4f46e5;
            background-color: #eef2ff;
        }

        .btn-cur:hover {
            background-color: #e0e7ff;
            color: #4338ca;
        }

        
        .status-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 9999px;
            border: 1px solid transparent;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23334155' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 0.875rem;
            box-shadow: var(--shadow-sm);
        }

        .status-con {
            background-color: var(--status-con-bg);
            color: var(--status-con-text);
            border-color: var(--status-con-border);
        }

        .status-pen {
            background-color: var(--status-pen-bg);
            color: var(--status-pen-text);
            border-color: var(--status-pen-border);
        }

        .status-nao {
            background-color: var(--status-nao-bg);
            color: var(--status-nao-text);
            border-color: var(--status-nao-border);
        }

        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            display: none;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="page-header">
            <div class="title-area">
                <h1>Painel de Gerenciamento</h1>
                <p>Gerencie contatos, currículos e status de atendimento em tempo real.</p>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Buscar por Nome ou ID..." 
                    autocomplete="off"
                >
            </div>
        </header>

        <main class="card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOME</th>
                            <th>TF</th>
                            <th>EM</th>
                            <th class="text-center">MSG</th>
                            <th class="text-center">CUR</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            
            <div id="emptyState" class="empty-state">
                <i class="fa-solid fa-folder-open"></i>
                <p>Nenhum registro foi encontrado com os termos pesquisados.</p>
            </div>
        </main>
    </div>

    <script>
       

        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');

        function getStatusClass(status) {
            switch (status) {
                case 'CON': return 'status-con';
                case 'PEN': return 'status-pen';
                case 'NÃO': return 'status-nao';
                default: return '';
            }
        }

        function updateStatusStyle(selectElement, id) {
            const newStatus = selectElement.value;
            
            selectElement.classList.remove('status-con', 'status-pen', 'status-nao');
            
            selectElement.classList.add(getStatusClass(newStatus));

            const item = mockData.find(d => d.id === id);
            if (item) {
                item.status = newStatus;
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = '';

            if (data.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            data.forEach(item => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td style="font-weight: 600; color: #334155;">#${item.id}</td>
                    <td style="font-weight: 500;">${item.nome}</td>
                    <td style="color: #64748b;">${item.tf}</td>
                    <td style="color: #64748b;">${item.em}</td>
                    <td class="text-center">
                        <button class="btn-action btn-msg" title="Enviar Mensagem">
                            <i class="fa-regular fa-paper-plane"></i>
                        </button>
                    </td>
                    <td class="text-center">
                        <button class="btn-action btn-cur" title="Visualizar Currículo">
                            <i class="fa-regular fa-file-pdf"></i>
                        </button>
                    </td>
                    <td>
                        <select 
                            class="status-select ${getStatusClass(item.status)}"
                            onchange="updateStatusStyle(this, ${item.id})"
                        >
                            <option value="CON" ${item.status === 'CON' ? 'selected' : ''}>CON</option>
                            <option value="PEN" ${item.status === 'PEN' ? 'selected' : ''}>PEN</option>
                            <option value="NÃO" ${item.status === 'NÃO' ? 'selected' : ''}>NÃO</option>
                        </select>
                    </td>
                `;

                tableBody.appendChild(tr);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();

            const filteredData = mockData.filter(item => {
                const matchesName = item.nome.toLowerCase().includes(term);
                const matchesId = item.id.toString().includes(term);
                return matchesName || matchesId;
            });

            renderTable(filteredData);
        });

        window.onload = () => {
            renderTable(mockData);
        };
    </script>
</body>
</html>
