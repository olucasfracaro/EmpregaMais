<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Buscador</title>
    <link rel="stylesheet" href="style_principal.css">
    <link rel="icon" href="ico.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="page-header">
            <div class="title-area">
                <h1>Painel de Gerenciamento</h1>
                <p>Gerencie contatos, currículos e status de atendimento em tempo real.</p>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Buscar por Nome ou ID..."
                    autocomplete="off"
                >
            </div>
        </header>

        <main class="card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOME</th>
                            <th>TELEFONE</th>
                            <th>EMAIL</th>
                            <th class="text-center">MENSAGEM</th>
                            <th class="text-center">CURRÍCULO</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            
            <div id="emptyState" class="empty-state">
                <i class="fa-solid fa-folder-open"></i>
                <p>Nenhum registro foi encontrado com os termos pesquisados.</p>
            </div>
        </main>
    </div>
    <script type="module" src="gerenciaCandidatos.js"></script>
</body>
</html>
