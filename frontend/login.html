<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Empregador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form class="painel-Login" id="PainelNookie">
    <header class="painel-header">
      <h1>Cadastro</h1>
    </header>

    <div class="campo-grupo">
      <label for="Nome">Nome</label>
      <input type="text" id="Nome" placeholder="Seu nome completo" required>
    </div>

    <div class="campo-grupo">
        <label for="Senha">Senha</label>
        <input type="senha" id="Senha" placeholder="Senha do Usuário" required>
    </div>

    <div class="campo-grupo">
      <label for="Email">E-mail</label>
      <input type="email" id="Email" placeholder="seu@email.com" required>
    </div>


    
    <button type="submit" class="btn-cadastrar">Enviar</button>

  </form>

  <script type="module" src="cadastroCandidato.js"></script>

</body>
</html>
