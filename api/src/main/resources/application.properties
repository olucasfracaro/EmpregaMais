spring.application.name=api

spring.config.import=optional:file:/workspaces/EmpregaMais/.env[.properties]
springdoc.enable-spring-security=true
spring.security.user.name=${SWAGGER_USERNAME}
spring.security.user.password=${SWAGGER_PASSWORD}

spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true